services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: devflow-db
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflowpassword
      POSTGRES_DB: devflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
